services:
  postgres:
    image: postgres:16-alpine
    container_name: questionei-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: questionei
      POSTGRES_PASSWORD: questionei_dev
      POSTGRES_DB: questionei_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questionei -d questionei_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: